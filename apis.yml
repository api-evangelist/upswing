aid: upswing
name: Upswing
description: >-
  Upswing Financial Technologies is an Indian open finance-as-a-service platform
  headquartered in Bengaluru and Mumbai. Its full-stack API platform lets consumer
  companies embed financial products such as deposits and lending from regulated
  partner banks (AU Small Finance Bank, DCB Bank, Utkarsh, Shivalik, Unity, South
  Indian Bank, Suryoday), while Upswing manages the bank integrations and
  compliance. Backed by QED Investors and Quona Capital. Upswing publishes no
  public developer portal or API documentation; its APIs are offered to partners
  under commercial agreements.
